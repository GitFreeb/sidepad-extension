<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Sidepad</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="modebar">
    <span class="modebar-title">Sidepad</span>
    <span class="api-mode-hint" id="apiModeHint" hidden></span>
    <button type="button" class="modebar-btn" id="openServerTabBtn" hidden></button>
    <button type="button" class="modebar-btn" id="apiSettingsBtn" hidden>⚙</button>
    <label class="api-mode-switch" for="apiModeToggle">
      <input type="checkbox" id="apiModeToggle">
      <span>Notes API</span>
      <span class="experimental-badge">dev</span>
    </label>
  </div>

  <section class="api-settings" id="apiSettings" hidden>
    <div class="api-settings-row">
      <span class="api-settings-label" id="apiConnLabel"></span>
      <span class="api-settings-value" id="apiConnState"></span>
    </div>
    <div class="api-settings-actions">
      <button type="button" id="apiConnectBtn"></button>
      <button type="button" id="apiForgetBtn"></button>
    </div>
    <p class="api-settings-hint" id="apiForgetHint"></p>
    <div class="api-settings-block">
      <label class="api-settings-label" for="apiLegacySelect" id="apiLegacyLabel"></label>
      <p class="api-settings-hint" id="apiLegacyPrompt" hidden></p>
      <div class="api-settings-actions">
        <div class="csel-native"><select id="apiLegacySelect"></select></div>
        <button type="button" id="apiLegacySaveBtn"></button>
      </div>
    </div>
    <details class="api-recovery" id="apiRecovery">
      <summary id="apiRecoverySummary"></summary>
      <p class="api-settings-hint" id="apiRecoveryHint"></p>
      <form class="api-pairing-form" id="apiPairingForm" autocomplete="off">
        <label><span id="apiPairingIdLabel"></span>
          <input type="text" class="input" id="apiPairingIdInput" spellcheck="false" autocomplete="off" required></label>
        <label><span id="apiPairingCodeLabel"></span>
          <input type="password" class="input" id="apiPairingCodeInput" spellcheck="false" autocomplete="new-password" required></label>
        <label><span id="apiPairingLabelLabel"></span>
          <input type="text" class="input" id="apiPairingLabelInput" value="Sidepad" maxlength="80" autocomplete="off" required></label>
        <button type="submit" id="apiPairBtn"></button>
      </form>
    </details>
  </section>

  <div class="app" id="legacyMode">

    <!-- Tab bar -->
    <div class="tabbar">
      <div class="tab-strip-wrap">
        <div class="tab-strip" id="tabStrip"><!-- rendered by JS --></div>
        <span class="tab-overflow-badge tab-overflow-left"  id="tabOverflowLeft"></span>
        <span class="tab-overflow-badge tab-overflow-right" id="tabOverflow"></span>
      </div>
      <div class="tabbar-actions">
        <button class="btn-auto-save" id="autoSaveBtn" title="Auto-save enabled">↓auto</button>
        <button class="btn-lang"  id="langBtn"  title="Switch to English">RU</button>
        <button class="btn-theme" id="themeBtn" title="Сменить тему">◐</button>
      </div>
    </div>

    <!-- Update notification -->
    <div class="update-banner" id="updateBanner" hidden>
      <span class="update-banner-text" id="updateBannerText"></span>
      <button class="update-banner-close" id="updateBannerClose" title="Скрыть">×</button>
    </div>

    <!-- Status / breadcrumb -->
    <div class="breadcrumb">
      <span class="bc-path">~/tasks/</span><span class="bc-file" id="bcFile">task.md</span>
      <span class="bc-sep">—</span>
      <span class="counter" id="counter">0 / 0</span>
      <span class="sync-state" id="syncState" hidden></span>
    </div>

    <div class="server-notice" id="serverNotice" role="status" aria-live="polite" hidden>
      <span class="server-notice-text" id="serverNoticeText"></span>
      <span class="server-notice-actions" id="serverNoticeActions"></span>
    </div>

    <!-- Add form -->
    <div class="add-form">
      <div class="add-form-group">
        <div class="field">
          <span class="field-icon">+</span>
          <input type="text" id="sectionInput" class="input" placeholder="новая секция..." maxlength="80">
        </div>
        <div class="field">
          <span class="field-icon">+</span>
          <input type="text" id="taskInput" class="input" placeholder="новая задача..." maxlength="240">
        </div>
        <div class="field">
          <input type="url"  id="linkInput" class="input url-input" placeholder="url (необязательно)">
        </div>
        <div class="csel input" id="sectionSelect" tabindex="0">
          <span class="csel-val" id="sectionSelectVal">Дополнительные задачи</span>
          <span class="csel-arr">▾</span>
          <ul class="csel-list" id="sectionSelectList"></ul>
        </div>
      </div>
      <button id="addBtn" class="btn-add" title="Добавить (Enter)">+ добавить</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn-upload" id="importBtn" title="Загрузить .md файл">↑ загрузить</button>
      <input type="file" id="importFileInput" accept=".md,.txt" hidden>
      <button class="btn-export" id="exportBtn" title="Выгрузить .md файл">↓ выгрузить</button>
      <button id="collapseAllBtn" class="btn-collapse-all">▸ свернуть все</button>
      <button id="clearDoneBtn" class="btn-clear">✕ очистить</button>
    </div>

    <!-- Task list -->
    <ul class="task-list" id="taskList"></ul>


  </div>

  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
  <script type="module" src="popup-api.js"></script>
</body>
</html>
